<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MANBELEK</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<style>
  :root {
    --bg: #f2f6f3;
    --surface: #ffffff;
    --ink: #10211a;
    --muted: #5d6f66;
    --line: #d9e3dc;
    --green: #0b5d3b;
    --on-green: #ffffff;
    --gold: #f5b800;
    --on-gold: #2a2000;
    --danger: #a3261b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1512;
      --surface: #16211c;
      --ink: #e8efea;
      --muted: #94a69c;
      --line: #263630;
      --green: #1f8f61;
      --on-green: #ffffff;
      --danger: #ff8a7d;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    padding-top: env(safe-area-inset-top, 0px);
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    border-bottom: 1px solid var(--line);
    background: var(--surface);
  }
  header h1 { font-size: 1.15rem; margin: 0; font-weight: 700; letter-spacing: -0.01em; }
  header h1 span { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--gold); margin-right: 8px; }
  #reset {
    background: none; border: 1px solid var(--line); color: var(--ink);
    border-radius: 999px; padding: 6px 14px; font: inherit; font-size: .9rem;
  }
  #chat { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .empty { margin: auto 0; padding: 8px 0; }
  .empty h2 { font-size: 1.5rem; line-height: 1.25; margin: 0 0 6px; letter-spacing: -0.02em; }
  .empty p { margin: 0 0 18px; color: var(--muted); }
  .sugg { display: flex; flex-direction: column; gap: 8px; }
  .sugg button {
    text-align: left; background: var(--surface); color: var(--ink);
    border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; font: inherit;
  }
  .msg { max-width: 92%; padding: 10px 14px; border-radius: 18px; overflow-wrap: anywhere; }
  .msg.user { align-self: flex-end; background: var(--green); color: var(--on-green); border-bottom-right-radius: 6px; white-space: pre-wrap; }
  .msg.model { align-self: flex-start; background: var(--surface); border: 1px solid var(--line); border-bottom-left-radius: 6px; }
  .msg.error { color: var(--danger); border-color: var(--danger); }
  .msg img { display: block; max-width: 100%; max-height: 220px; border-radius: 10px; margin-bottom: 8px; }
  .msg img.gen { max-height: none; width: 100%; margin: 8px 0 4px; min-height: 120px; background: var(--bg); }
  .msg a.dl { font-size: .9rem; color: var(--green); }
  .msg.model > :first-child { margin-top: 0; }
  .msg.model > :last-child { margin-bottom: 0; }
  .msg.model p { margin: 0 0 .7em; }
  .msg.model pre { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px; overflow-x: auto; font-size: .85rem; }
  .msg.model code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .9em; }
  .msg.model :not(pre) > code { background: var(--bg); padding: 1px 5px; border-radius: 5px; }
  .msg.model .katex-display { overflow-x: auto; overflow-y: hidden; }
  .typing { display: inline-flex; gap: 5px; padding: 4px 0; }
  .typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); animation: blink 1.2s infinite; }
  .typing i:nth-child(2) { animation-delay: .2s; }
  .typing i:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .typing i { animation: none; opacity: .6; } }
  #composer {
    background: var(--surface); border-top: 1px solid var(--line);
    padding: 10px 12px calc(10px + env(safe-area-inset-bottom, 0px));
  }
  #preview { display: none; align-items: center; gap: 10px; margin-bottom: 8px; }
  #preview.on { display: flex; }
  #preview img { height: 52px; width: 52px; object-fit: cover; border-radius: 10px; border: 1px solid var(--line); }
  #preview button { background: none; border: none; color: var(--muted); font: inherit; text-decoration: underline; padding: 6px; }
  .row { display: flex; align-items: flex-end; gap: 8px; }
  .row button {
    flex: none; height: 44px; border-radius: 22px; border: none; font: inherit; font-weight: 600;
  }
  #photoBtn { width: 44px; background: var(--bg); color: var(--ink); border: 1px solid var(--line); }
  #send { padding: 0 18px; background: var(--gold); color: var(--on-gold); }
  #send:disabled { opacity: .5; }
  #input {
    flex: 1; min-height: 44px; max-height: 140px; resize: none;
    border: 1px solid var(--line); border-radius: 22px; padding: 10px 14px;
    background: var(--bg); color: var(--ink); font: inherit;
  }
  #gate { position: fixed; inset: 0; z-index: 10; display: none; align-items: center; justify-content: center;
    background: var(--bg); padding: calc(20px + env(safe-area-inset-top, 0px)) 20px calc(20px + env(safe-area-inset-bottom, 0px)); overflow-y: auto; }
  #gate.on { display: flex; }
  #gate .card { width: 100%; max-width: 420px; background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 22px; }
  #gate h2 { margin: 0 0 6px; font-size: 1.4rem; letter-spacing: -0.02em; }
  #gate p { margin: 0 0 14px; color: var(--muted); }
  #gate input { width: 100%; min-height: 46px; border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px;
    background: var(--bg); color: var(--ink); font: inherit; letter-spacing: .05em; text-transform: uppercase; }
  #gate .err { color: var(--danger); min-height: 1.4em; margin: 8px 0 0; }
  #codeBtn { width: 100%; height: 46px; margin-top: 10px; border: none; border-radius: 23px; background: var(--gold); color: var(--on-gold); font: inherit; font-weight: 700; }
  #gateLinks { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; }
  #gateLinks a { display: block; text-align: center; padding: 12px; border: 1px solid var(--line); border-radius: 12px; color: var(--green); font-weight: 600; text-decoration: none; }
  button:focus-visible, textarea:focus-visible, input:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
</style>
</head>
<body>
<header>
  <h1><span></span><b id="nom">MANBELEK</b></h1>
  <button id="reset" type="button">Nouvelle discussion</button>
</header>

<main id="chat" aria-live="polite"></main>

<div id="composer">
  <div id="preview">
    <img id="previewImg" alt="Photo à envoyer">
    <button id="removeImg" type="button">Retirer la photo</button>
  </div>
  <div class="row">
    <button id="photoBtn" type="button" aria-label="Ajouter une photo">📷</button>
    <textarea id="input" rows="1" placeholder="Pose ta question…"></textarea>
    <button id="send" type="button">Envoyer</button>
  </div>
  <input id="file" type="file" accept="image/*" hidden>
</div>

<div id="gate" role="dialog" aria-modal="true" aria-labelledby="gateTitle">
  <div class="card">
    <h2 id="gateTitle">Accès</h2>
    <p id="gatePrice"></p>
    <input id="codeInput" type="text" autocomplete="off" autocapitalize="characters" placeholder="Ton code d'accès">
    <p id="gateErr" class="err" role="alert"></p>
    <button id="codeBtn" type="button">Valider</button>
    <div id="gateLinks"></div>
  </div>
</div>

<script>
const NOM_IA = "MANBELEK"; // doit correspondre au nom dans netlify/functions/chat.js

// ----- Accès payant : à remplir par toi -----
const PRIX = "5 000 FCFA / mois";
const LIEN_PAIEMENT = "";   // ton lien FedaPay / KKiaPay / PayPal (laisse vide pour le masquer)
const WHATSAPP = "";        // ton numéro WhatsApp avec l'indicatif, sans + (ex : 229XXXXXXXX)
const FONCTION = "/.netlify/functions/chat";

function getCode() { try { return localStorage.getItem("code") || ""; } catch (e) { return ""; } }
function saveCode(c) { try { localStorage.setItem("code", c); } catch (e) {} }
function clearCode() { try { localStorage.removeItem("code"); } catch (e) {} }

async function verifier(code) {
  try {
    const r = await fetch(FONCTION, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ check: true, code: code })
    });
    return r.status;
  } catch (e) { return 0; }
}

function showGate(msg) {
  const gate = document.getElementById("gate");
  document.getElementById("gateTitle").textContent = "Accès à " + NOM_IA;
  document.getElementById("gatePrice").textContent =
    "Entre ton code d'accès pour utiliser " + NOM_IA + ". Abonnement : " + PRIX + ".";
  document.getElementById("gateErr").textContent = msg || "";
  const links = document.getElementById("gateLinks");
  links.innerHTML = "";
  if (LIEN_PAIEMENT) {
    const a = document.createElement("a");
    a.href = LIEN_PAIEMENT; a.target = "_blank"; a.rel = "noopener";
    a.textContent = "Payer " + PRIX;
    links.appendChild(a);
  }
  if (WHATSAPP) {
    const a = document.createElement("a");
    a.href = "https://wa.me/" + WHATSAPP + "?text=" + encodeURIComponent("Bonjour, j'ai payé l'accès à " + NOM_IA + ". Voici ma preuve de paiement.");
    a.target = "_blank"; a.rel = "noopener";
    a.textContent = "Envoyer la preuve de paiement sur WhatsApp";
    links.appendChild(a);
  }
  gate.classList.add("on");
}

document.getElementById("codeBtn").onclick = async function () {
  const code = document.getElementById("codeInput").value.trim();
  if (!code) return;
  const err = document.getElementById("gateErr");
  err.textContent = "Vérification…";
  const st = await verifier(code);
  if (st === 200) {
    saveCode(code);
    document.getElementById("gate").classList.remove("on");
  } else if (st === 401) {
    err.textContent = "Code invalide ou expiré.";
  } else {
    err.textContent = "Connexion impossible. Vérifie ton réseau.";
  }
};

document.title = NOM_IA;
document.getElementById("nom").textContent = NOM_IA;

const chat = document.getElementById("chat");
const input = document.getElementById("input");
const sendBtn = document.getElementById("send");
const fileInput = document.getElementById("file");
const preview = document.getElementById("preview");
const previewImg = document.getElementById("previewImg");

let history = [];       // [{role:'user'|'model', text}]
let pendingImage = null; // {mime, data, url}
let busy = false;

const SUGGESTIONS = [
  "Résous : 3x² − 12x + 9 = 0, étape par étape",
  "Explique-moi une leçon de PCT de 3ème",
  "Envoie une photo de ton exercice, quelle que soit la matière",
  "Génère une image d'un lion au coucher du soleil",
  "Explique-moi comment créer mon propre chatbot"
];

function showEmpty() {
  chat.innerHTML = "";
  const box = document.createElement("div");
  box.className = "empty";
  box.innerHTML = "<h2>Bonjour, je suis " + NOM_IA + ".</h2><p>Exercices de la 6ème à la terminale, photos à traduire, création d'IA : pose ta question.</p>";
  const list = document.createElement("div");
  list.className = "sugg";
  SUGGESTIONS.forEach(function (s) {
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = s;
    b.onclick = function () {
      if (s.indexOf("photo") !== -1) { fileInput.click(); return; }
      input.value = s; send();
    };
    list.appendChild(b);
  });
  box.appendChild(list);
  chat.appendChild(box);
}

function esc(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

// Markdown + formules : on protège les formules avant le Markdown pour que _ et * ne les abîment pas.
function renderModel(el, text) {
  if (!window.marked || !window.DOMPurify) { el.textContent = text; return; }
  const store = [];
  const safe = text.replace(/\$\$[\s\S]+?\$\$|\$[^\n$]+?\$/g, function (m) {
    store.push(m);
    return "@@M" + (store.length - 1) + "@@";
  });
  let html = DOMPurify.sanitize(marked.parse(safe, { breaks: true }));
  html = html.replace(/@@M(\d+)@@/g, function (_, i) { return esc(store[i]); });
  el.innerHTML = html;
  if (window.renderMathInElement) {
    try {
      renderMathInElement(el, {
        delimiters: [
          { left: "$$", right: "$$", display: true },
          { left: "$", right: "$", display: false }
        ],
        throwOnError: false
      });
    } catch (e) {}
  }
}

function addMsg(role, text, imgUrl, isError, imagePrompt) {
  const empty = chat.querySelector(".empty");
  if (empty) chat.innerHTML = "";
  const d = document.createElement("div");
  d.className = "msg " + role + (isError ? " error" : "");
  if (imgUrl) {
    const im = document.createElement("img");
    im.src = imgUrl; im.alt = "Photo envoyée";
    d.appendChild(im);
  }
  if (role === "model" && !isError) {
    const w = document.createElement("div");
    renderModel(w, text);
    d.appendChild(w);
  } else if (text) {
    d.appendChild(document.createTextNode(text));
  }
  if (imagePrompt) {
    const url = "https://image.pollinations.ai/prompt/" + encodeURIComponent(imagePrompt) +
      "?width=768&height=768&nologo=true&seed=" + Math.floor(Math.random() * 1000000);
    const g = document.createElement("img");
    g.className = "gen"; g.alt = "Image générée"; g.src = url;
    g.onload = function () { chat.scrollTop = chat.scrollHeight; };
    const a = document.createElement("a");
    a.className = "dl"; a.href = url; a.target = "_blank"; a.rel = "noopener";
    a.textContent = "Ouvrir l'image pour l'enregistrer";
    g.onerror = function () { g.remove(); a.textContent = "L'image n'a pas pu se charger. Réessaie dans un instant."; };
    d.appendChild(g); d.appendChild(a);
  }
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
  return d;
}

function addTyping() {
  const d = document.createElement("div");
  d.className = "msg model";
  d.innerHTML = '<span class="typing" aria-label="' + NOM_IA + ' écrit"><i></i><i></i><i></i></span>';
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
  return d;
}

// Réduit la photo (1280 px max, JPEG) pour un envoi rapide et peu de données mobiles.
function compress(file) {
  return new Promise(function (resolve, reject) {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = function () {
      const max = 1280;
      const scale = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * scale);
      c.height = Math.round(img.height * scale);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      const dataUrl = c.toDataURL("image/jpeg", 0.8);
      URL.revokeObjectURL(url);
      resolve({ mime: "image/jpeg", data: dataUrl.split(",")[1], url: dataUrl });
    };
    img.onerror = function () { URL.revokeObjectURL(url); reject(new Error("image")); };
    img.src = url;
  });
}

function clearImage() {
  pendingImage = null;
  preview.classList.remove("on");
  previewImg.removeAttribute("src");
  fileInput.value = "";
}

document.getElementById("photoBtn").onclick = function () { fileInput.click(); };
document.getElementById("removeImg").onclick = clearImage;
fileInput.onchange = async function () {
  const f = fileInput.files[0];
  if (!f) return;
  try {
    pendingImage = await compress(f);
    previewImg.src = pendingImage.url;
    preview.classList.add("on");
  } catch (e) {
    addMsg("model", "Impossible de lire cette photo. Essaie avec une autre image.", null, true);
  }
};

input.addEventListener("input", function () {
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 140) + "px";
});

async function send() {
  if (busy) return;
  const text = input.value.trim();
  if (!text && !pendingImage) return;
  busy = true; sendBtn.disabled = true;

  const img = pendingImage;
  addMsg("user", text, img ? img.url : null);
  input.value = ""; input.style.height = "auto";
  clearImage();
  const typing = addTyping();

  try {
    const res = await fetch(FONCTION, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        code: getCode(),
        history: history,
        message: text,
        image: img ? { mime: img.mime, data: img.data } : null
      })
    });
    let data = null;
    try { data = await res.json(); } catch (e) {}
    typing.remove();
    if (res.status === 401) {
      clearCode();
      input.value = text;
      busy = false; sendBtn.disabled = false;
      showGate("Ton code est invalide ou a expiré.");
      return;
    }
    if (!res.ok || !data || !data.reply) {
      const msg = (data && data.error) ||
        "La réponse a pris trop de temps ou a échoué. Réessaie, ou pose la question en plus court.";
      addMsg("model", msg, null, true);
    } else {
      const m = /\[\[IMAGE:\s*([^\]]+)\]\]/.exec(data.reply);
      const clean = data.reply.replace(/\[\[IMAGE:[^\]]*\]\]/g, "").trim();
      history.push({ role: "user", text: text || "[photo]" });
      history.push({ role: "model", text: clean || "[image générée]" });
      addMsg("model", clean, null, false, m ? m[1].trim() : null);
    }
  } catch (e) {
    typing.remove();
    addMsg("model", "Pas de connexion. Vérifie ton réseau et réessaie.", null, true);
  }
  busy = false; sendBtn.disabled = false;
}

sendBtn.onclick = send;
input.addEventListener("keydown", function (e) {
  if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); send(); }
});
document.getElementById("reset").onclick = function () {
  history = []; clearImage(); showEmpty();
};

showEmpty();
verifier(getCode()).then(function (st) { if (st === 401) showGate(); });
</script>
</body>
  </html>
